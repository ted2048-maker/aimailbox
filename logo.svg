  <!-- AI 指示灯 - 三个小点 -->
  <circle cx="155" cy="48" r="8" fill="#10B981" opacity="0.4"/>
  <circle cx="175" cy="48" r="8" fill="#10B981" opacity="0.7"/>
  <circle cx="195" cy="48" r="8" fill="#10B981"/>

  <!-- 信封轮廓 - 放大 -->
